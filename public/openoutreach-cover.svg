<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>

  <!-- Left Side: Terminal / Email Engine Card -->
  <g transform="translate(140, 180)" filter="url(#shadow)">
    <rect width="260" height="315" rx="28" fill="#1e293b"/>
    <!-- Terminal window header dots -->
    <circle cx="36" cy="36" r="6" fill="#10b981"/>
    <circle cx="56" cy="36" r="6" fill="#64748b"/>
    <circle cx="76" cy="36" r="6" fill="#64748b"/>

    <!-- Code / message line placeholders -->
    <rect x="36" y="75" width="188" height="8" rx="4" fill="#34d399"/>
    <rect x="36" y="105" width="150" height="8" rx="4" fill="#334155"/>
    <rect x="36" y="130" width="170" height="8" rx="4" fill="#334155"/>
    <rect x="36" y="155" width="130" height="8" rx="4" fill="#334155"/>
    <rect x="36" y="180" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="36" y="205" width="110" height="8" rx="4" fill="#334155"/>

    <!-- Dispatch Green Mail Badge -->
    <g transform="translate(200, 105)" filter="url(#pillShadow)">
      <rect width="115" height="80" rx="18" fill="#10b981"/>
      <path d="M12 20 L57.5 52 L103 20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="12" y="18" width="91" height="46" rx="6" fill="none" stroke="#ffffff" stroke-width="6"/>
    </g>
  </g>

  <!-- Connecting Dispatch Flow Lines -->
  <!-- Main stem -->
  <path d="M460, 337 L640, 337" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="640" cy="337" r="7" fill="#10b981"/>

  <!-- Branches to recipients -->
  <path d="M640, 337 C 720, 337 760, 160 860, 160" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="862,155 876,160 862,165" fill="#10b981"/>

  <path d="M640, 337 C 720, 337 760, 248 860, 248" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="862,243 876,248 862,253" fill="#10b981"/>

  <path d="M640, 337 L 860, 337" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="862,332 876,337 862,342" fill="#10b981"/>

  <path d="M640, 337 C 720, 337 760, 426 860, 426" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="862,421 876,426 862,431" fill="#10b981"/>

  <path d="M640, 337 C 720, 337 760, 514 860, 514" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="862,509 876,514 862,519" fill="#10b981"/>

  <!-- Target Channel Cards (Right column) -->
  <!-- 1. Gmail -->
  <g transform="translate(890, 125)" filter="url(#pillShadow)">
    <rect width="90" height="70" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(27, 20)">
      <path d="M3 5 L18 17 L33 5" fill="none" stroke="#ea4335" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="3" y="5" width="30" height="24" rx="3" fill="none" stroke="#4285f4" stroke-width="3.5"/>
    </g>
    <!-- Checkmark status -->
    <circle cx="140" cy="35" r="16" fill="#10b981"/>
    <path d="M133 35 L138 40 L148 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. Outlook / Office -->
  <g transform="translate(890, 213)" filter="url(#pillShadow)">
    <rect width="90" height="70" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(27, 20)">
      <rect x="4" y="5" width="28" height="24" rx="4" fill="#0078d4"/>
      <text x="18" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">O</text>
    </g>
    <!-- Checkmark status -->
    <circle cx="140" cy="35" r="16" fill="#10b981"/>
    <path d="M133 35 L138 40 L148 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3. General Email -->
  <g transform="translate(890, 302)" filter="url(#pillShadow)">
    <rect width="90" height="70" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(27, 20)">
      <path d="M4 6 L18 17 L32 6" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
      <rect x="4" y="6" width="28" height="22" rx="4" fill="none" stroke="#8b5cf6" stroke-width="3"/>
    </g>
    <!-- Checkmark status -->
    <circle cx="140" cy="35" r="16" fill="#10b981"/>
    <path d="M133 35 L138 40 L148 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. Telegram / Fast Dispatch -->
  <g transform="translate(890, 391)" filter="url(#pillShadow)">
    <rect width="90" height="70" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(28, 20)">
      <path d="M6 18 L28 6 L22 28 L16 22 L14 26 L12 20 Z" fill="#10b981"/>
    </g>
    <!-- Clock / Scheduled status -->
    <circle cx="140" cy="35" r="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <path d="M140 27 L140 35 L145 35" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 5. More integrations -->
  <g transform="translate(890, 479)" filter="url(#pillShadow)">
    <rect width="90" height="70" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="3.5" fill="#94a3b8"/>
    <circle cx="45" cy="35" r="3.5" fill="#94a3b8"/>
    <circle cx="56" cy="35" r="3.5" fill="#94a3b8"/>
    <!-- Neutral status dot -->
    <circle cx="140" cy="35" r="14" fill="#94a3b8"/>
  </g>
</svg>
