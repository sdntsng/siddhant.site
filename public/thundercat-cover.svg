  <path d="M 330 218 Q 300 220 280 232" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 335 226 Q 305 235 285 250" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>

